# infra/nginx.conf
# This is a sample NGINX template for reverse proxying traffic to the PM2 cluster
# It includes standard security headers and forwards important protocol info.

server {
    listen 80;
    server_name api.server.com;
    
    # Redirect HTTP traffic to HTTPS (Requires SSL certificates, e.g. Certbot/Let's Encrypt)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        
        # Pass real client IP and protocol to Node layer (checked by our security middlewares)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
